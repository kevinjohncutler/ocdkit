name: CI/CD

on:
  push:
    branches:
      - '**'        # run tests on every branch push ...
      - '!badges'   # ... except the CI-managed badges branch ([skip ci] also guards it)
    tags:
      - "v*"        # tags still gate deploy + badge publishing (see job `if:`s)
  pull_request:

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python_version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]  # macos-latest = Apple Silicon (MPS)
        python_version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for setuptools_scm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip

      - name: Install package with dev deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -e . pytest pytest-cov nbformat nbclient ipykernel ipywidgets wgpu

      - name: Run tests
        shell: bash
        env:
          PYTORCH_ENABLE_MPS_FALLBACK: "1"
        run: |
          python -m pytest tests/ \
            --cov=ocdkit --cov-report=xml --cov-report=term \
            --junitxml=junit.xml \
            -v

      - name: Upload coverage & junit artifacts
        if: matrix.os == 'macos-latest' && matrix.python_version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage.xml
            junit.xml

  deploy:
    name: Deploy to PyPI
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine setuptools setuptools_scm wheel

      - name: Build distribution
        run: python -m build --sdist --wheel

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TWINE_API_KEY }}
        run: python -m twine upload dist/*

  badges:
    name: Build and publish badges
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-results

      - name: Install badge dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'genbadge[coverage,tests]'

      - name: Generate badges
        run: |
          mkdir -p badges
          genbadge coverage -i coverage.xml -o badges/coverage.svg
          genbadge tests -i junit.xml -o badges/tests.svg

      - name: Publish badges to the orphan 'badges' branch
        # Badges live on a dedicated 'badges' branch, NEVER on main. Committing
        # them to main advanced origin/main on every release and rejected the
        # next developer push ("Updates were rejected ... fetch first"). The
        # branch is rebuilt from scratch and force-pushed each release, holding
        # only the SVGs; reference them via the raw badges-branch URL, e.g.
        # https://raw.githubusercontent.com/${{ github.repository }}/badges/badges/coverage.svg
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          svgs="$(mktemp -d)"
          cp badges/*.svg "$svgs/"
          git checkout --orphan badges
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p badges
          cp "$svgs"/*.svg badges/
          git add badges/coverage.svg badges/tests.svg
          git commit -m "CI: update coverage and test badges [skip ci]"
          git push -f origin badges
